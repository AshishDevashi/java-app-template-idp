name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build
        run: mvn --batch-mode package -DskipTests

      - name: Health check
        run: |
          mvn --batch-mode spring-boot:run &
          for _ in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8080/health && exit 0
            sleep 1
          done
          echo "health check failed" >&2
          exit 1
